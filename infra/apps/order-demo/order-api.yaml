apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/part-of: order-demo
spec:
  selector:
    app.kubernetes.io/name: order-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/part-of: order-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
        app.kubernetes.io/part-of: order-demo
    spec:
      containers:
        - name: app
          image: order-api:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-dev-kafka-bootstrap.platform-system.svc:9092
            - name: KAFKA_USERNAME
              value: order-api
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-api
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
